version: "v1.0"
name: rails_api_logger
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
auto_cancel:
  running:
    when: "true"

blocks:
  - name: tests
    execution_time_limit:
      minutes: 10
    task:
      secrets:
        - name: rails_api_logger
      prologue:
        commands:
          - checkout --use-cache
          - cache restore
          - bundle config set path 'vendor/bundle'
          - bundle install -j 4

          - cache store
      env_vars:
        - name: BUNDLE_GEMFILE
          value: /home/semaphore/rails_api_logger/gemfiles/rails_8.0.gemfile
      jobs:
        - name: linter
          commands:
            - bundle exec standardrb
        - name: tests postgres separate db and separate target | rails 8.0
          env_vars:
            - name: SAME_DB
              value: "false"
            - name: SAME_TARGET
              value: "false"
            - name: TARGET_DB
              value: postgres
            - name: RAILS_ENV
              value: test
          commands:
            - sem-service start postgres 14
            - bin/rails db:prepare
            - bundle exec rake
        - name: tests postgres separate db and same target | rails 8.0
          env_vars:
            - name: SAME_DB
              value: "false"
            - name: SAME_TARGET
              value: "true"
            - name: TARGET_DB
              value: postgres
            - name: RAILS_ENV
              value: test
          commands:
            - sem-service start postgres 14
            - bin/rails db:prepare
            - bundle exec rake
        - name: tests postgres same db and separate target | rails 8.0
          env_vars:
            - name: SAME_DB
              value: "true"
            - name: TARGET_DB
              value: postgres
            - name: RAILS_ENV
              value: test
          commands:
            - sem-service start postgres 14
            - bin/rails db:prepare
            - bundle exec rake
        - name: tests postgres separate db and separate target | rails 7.2
          env_vars:
            - name: SAME_DB
              value: "false"
            - name: SAME_TARGET
              value: "false"
            - name: TARGET_DB
              value: postgres
            - name: RAILS_ENV
              value: test
            - name: BUNDLE_GEMFILE
              value: /home/semaphore/rails_api_logger/gemfiles/rails_7.2.gemfile
          commands:
            - sem-service start postgres 14
            - bin/rails db:prepare
            - bundle exec rake
        - name: tests sqlite separate db and separate target | rails 8.0
          env_vars:
            - name: SAME_DB
              value: "false"
            - name: SAME_TARGET
              value: "false"
            - name: TARGET_DB
              value: sqlite
            - name: RAILS_ENV
              value: test
          commands:
            - bin/rails db:prepare
            - bundle exec rake
        - name: tests sqlite same db | rails 8.0
          env_vars:
            - name: SAME_DB
              value: "true"
            - name: TARGET_DB
              value: sqlite
            - name: RAILS_ENV
              value: test
          commands:
            - bin/rails db:prepare
            - bundle exec rake
        - name: tests webrick | rails 8.0
          env_vars:
            - name: SAME_DB
              value: "true"
            - name: TARGET_DB
              value: sqlite
            - name: RAILS_ENV
              value: test
            - name: BUNDLE_GEMFILE
              value: /home/semaphore/rails_api_logger/gemfiles/rails_webrick_8.0.gemfile
          commands:
            - bin/rails db:prepare
            - bundle exec rake
promotions:
  - name: main
    pipeline_file: main-deploy.yml
