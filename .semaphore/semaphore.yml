version: "v1.0"
name: rails_api_logger
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
auto_cancel:
  running:
    when: "true"

blocks:
  - name: tests
    execution_time_limit:
      minutes: 10
    task:
      secrets:
        - name: rails_api_logger
      prologue:
        commands:
          - checkout --use-cache
          - sem-version ruby $(cat .ruby-version) -f
          - cache restore
          - bundle config set path 'vendor/bundle'
          - bundle config set clean 'true'
          - bundle install -j 4
          - cache store
      env_vars:
        - name: BUNDLE_GEMFILE
          value: /home/semaphore/rails_api_logger/gemfiles/rails_8.0.gemfile
      jobs:
        - name: linter
          commands:
            - bin/fastcheck
        - name: tests postgres separate db and separate target | rails 8.0
          env_vars:
            - name: SAME_DB
              value: "false"
            - name: SAME_TARGET
              value: "false"
            - name: TARGET_DB
              value: postgres
            - name: RAILS_ENV
              value: test
          commands:
            - sem-service start postgres 14
            - bin/check
        - name: tests postgres separate db and same target | rails 8.0
          env_vars:
            - name: SAME_DB
              value: "false"
            - name: SAME_TARGET
              value: "true"
            - name: TARGET_DB
              value: postgres
            - name: RAILS_ENV
              value: test
          commands:
            - sem-service start postgres 14
            - bin/check
        - name: tests postgres same db | rails 8.0
          env_vars:
            - name: SAME_DB
              value: "true"
            - name: TARGET_DB
              value: postgres
            - name: RAILS_ENV
              value: test
          commands:
            - sem-service start postgres 14
            - bin/check
        - name: tests postgres separate db and separate target | rails 8.1
          env_vars:
            - name: SAME_DB
              value: "false"
            - name: SAME_TARGET
              value: "false"
            - name: TARGET_DB
              value: postgres
            - name: RAILS_ENV
              value: test
            - name: BUNDLE_GEMFILE
              value: /home/semaphore/rails_api_logger/gemfiles/rails_8.1.gemfile
          commands:
            - sem-service start postgres 14
            - bin/check
        - name: tests mysql separate db and separate target | rails 8.0
          env_vars:
            - name: SAME_DB
              value: "false"
            - name: SAME_TARGET
              value: "false"
            - name: TARGET_DB
              value: mysql
            - name: RAILS_ENV
              value: test
          commands:
            - sem-service start mysql 8.0
            - bin/check
        - name: tests mysql separate db and same target | rails 8.0
          env_vars:
            - name: SAME_DB
              value: "false"
            - name: SAME_TARGET
              value: "true"
            - name: TARGET_DB
              value: mysql
            - name: RAILS_ENV
              value: test
          commands:
            - sem-service start mysql 8.0
            - bin/check
        - name: tests mysql same db | rails 8.0
          env_vars:
            - name: SAME_DB
              value: "true"
            - name: TARGET_DB
              value: mysql
            - name: RAILS_ENV
              value: test
          commands:
            - sem-service start mysql 8.0
            - bin/check
        - name: tests sqlite separate db and separate target | rails 8.0
          env_vars:
            - name: SAME_DB
              value: "false"
            - name: SAME_TARGET
              value: "false"
            - name: TARGET_DB
              value: sqlite
            - name: RAILS_ENV
              value: test
          commands:
            - bin/check
        - name: tests sqlite same db | rails 8.0
          env_vars:
            - name: SAME_DB
              value: "true"
            - name: TARGET_DB
              value: sqlite
            - name: RAILS_ENV
              value: test
          commands:
            - bin/check
        - name: tests webrick | rails 8.0
          env_vars:
            - name: SAME_DB
              value: "true"
            - name: TARGET_DB
              value: sqlite
            - name: RAILS_ENV
              value: test
            - name: BUNDLE_GEMFILE
              value: /home/semaphore/rails_api_logger/gemfiles/rails_webrick_8.0.gemfile
          commands:
            - bin/check
promotions:
  - name: release
    pipeline_file: release.yml
    auto_promote:
      when: "result = 'passed' and tag =~ '^[0-9]+[.][0-9]+[.][0-9]+$'"
